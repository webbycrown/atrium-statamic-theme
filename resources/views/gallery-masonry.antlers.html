{{ partial:inner-banner banner_title="Gallery Masonry" }}
<section>
  <div class="container">
    <div class="gallery-masonry" data-gallery-grid>
      {{ collection:gallery sort="order:asc" }}
      <div class="relative group gallery-masonry-item{{ if index >= 9 }} atrium-gallery-hide{{ /if }}" data-gallery-item>
        <div class="relative overflow-hidden rounded-xl after:w-full after:transition-all after:h-full after:absolute after:top-0 after:left-0 after:bg-dark-900 after:opacity-20 group-hover:after:opacity-40">
          {{ if image }}
          <img src="{{ image:url }}" alt="{{ title }}" loading="{{ if index >= 9 }}lazy{{ else }}eager{{ /if }}" class="transition-all group-hover:scale-105 w-full object-cover duration-300">
          {{ /if }}
        </div>
      </div>
      {{ /collection:gallery }}
    </div>
    <div class="mt-16 mb-10 text-center" data-gallery-sentinel>
      <button type="button" class="btn btn-primary mx-auto" data-gallery-status>Load more</button>
    </div>
    <div class="mb-10 text-center">
      <a href="/gallery" class="text-primary hover:underline">Grid view</a>
    </div>
  </div>
</section>
{{ partial:gallery-scroll }}
