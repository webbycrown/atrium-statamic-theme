<div class="group relative bg-white shadow-box-1 rounded-xl tour-result-card">
  <div class="event-card-media w-full overflow-hidden rounded-t-xl relative group-hover:opacity-75">
    <a href="{{ url }}">
      <img src="{{ if image }}{{ image:url }}{{ else }}/assets/images/event-venue-20.jpg{{ /if }}" alt="{{ title }}">
    </a>
  </div>
  <div class="event-card-body">
    <h3 class="event-card-title text-1xl text-dark-700 leading-2xl group-hover:text-primary-900 text-center">
      <a href="{{ url }}">{{ title }}</a>
    </h3>
    {{ if excerpt }}<p class="event-card-excerpt text-center text-md">{{ excerpt }}</p>{{ /if }}
    <div class="event-card-meta px-5 flex justify-between">
      <div class="flex items-center gap-2 text-sm">
        <img src="/assets/images/clock-icon.svg" alt="">
        {{ duration }}
      </div>
      <div class="flex items-center gap-2 text-sm">
        <img src="/assets/images/star-icon.svg" alt="">
        {{ rating ?? '4.8' }}
      </div>
    </div>
  </div>
  <div class="event-card-price">
    <span class="event-card-price-label">From</span>
    {{ if price }}<span class="event-card-price-now">${{ price | format_number:0 }}</span>{{ /if }}
    {{ if compare_price }}<span class="event-card-price-was">${{ compare_price | format_number:0 }}</span>{{ /if }}
  </div>
</div>
