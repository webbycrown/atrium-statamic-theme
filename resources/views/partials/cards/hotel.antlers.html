<div class="group relative">
  <div class="w-full overflow-hidden rounded-2xl before:pt-[65%] before:block relative group-hover:opacity-75">
    <a href="{{ url }}" class="absolute top-0 left-0 h-full w-full">
      {{ if image }}<img src="{{ image:url }}" alt="{{ title }}" class="h-full w-full object-cover object-center">{{ /if }}
    </a>
  </div>
  <div class="mt-5">
    <h3 class="text-1xl text-dark-700 leading-2xl mb-2 group-hover:text-primary-900">
      <a href="{{ url }}">{{ title }}</a>
    </h3>
    {{ if excerpt }}<p class="text-md mb-2">{{ excerpt }}</p>{{ /if }}
    <div class="mt-4 flex justify-between">
      <div>
        <p class="text-[12px] flex items-center gap-2 text-dark-800 m-0 leading-md">
          <span class="flex items-center gap-1 text-[#FFC738]">
            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
          </span>
          ({{ reviews_count ?? stars ?? 1 }} Review)
        </p>
      </div>
      <div class="text-right">
        {{ if compare_price }}<span class="text-sm font-semibold text-dark-800 line-through block">${{ compare_price | format_number:0 }}</span>{{ /if }}
        {{ if price }}<span class="text-xl font-bold text-dark-900 block">${{ price | format_number:0 }}</span>{{ /if }}
      </div>
    </div>
  </div>
</div>
