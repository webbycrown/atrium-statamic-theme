<head>
  <meta charset="utf-8">
  <title>{{ title ?? site:name }}</title>
  {{ setting }}
    {{ if favicon }}{{ favicon }}<link rel="icon" type="image/png" href="{{ url }}?v=20260912b" />{{ /favicon }}{{ /if }}
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png?v=20260912b">
  {{ /setting }}
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style id="theme-fouc">
    html { background: #fff; }
    body { margin: 0; }
    body:not(.is-ready) { overflow: hidden; }
    body:not(.is-ready) > *:not(.preloader) { visibility: hidden !important; }
    .preloader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #fff; }
    .preloader img { width: 150px; max-width: 60%; }
    body.is-ready { overflow: visible !important; }
    body.is-ready .preloader { opacity: 0; pointer-events: none; }
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .site-logo img,.logo img{display:block;width:100%;height:auto;}
    .blog-card-media{position:relative;overflow:hidden;min-height:280px;}
    .blog-card-media > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    .latest-blog-card{position:relative;min-height:280px;}
    .latest-blog-card .latest-blog-media{position:absolute;inset:0;}
    .latest-blog-card .latest-blog-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    @media (min-width:768px){.latest-blog-card{min-height:340px;}}
    .events-catalog-section{padding-bottom:4rem;}
    .tours-results-grid{display:grid;grid-template-columns:1fr;gap:28px;align-items:stretch;}
    @media (min-width:640px){.tours-results-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px;}}
    @media (min-width:1024px){.tours-results-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 28px;}}
    .tour-result-card{display:flex;flex-direction:column;height:100%;}
    .event-card-body{display:flex;flex-direction:column;flex:1 1 auto;padding:20px 16px 0;}
    .event-card-title{min-height:2.6em;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .event-card-excerpt{min-height:2.8em;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .event-card-meta{margin-top:auto;padding-top:16px;padding-bottom:16px;}
    .event-card-price{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:12px 16px;margin-top:auto;background:#F4EFE6;border-radius:0 0 0.75rem 0.75rem;}
    .event-card-price-label{font-size:0.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8A8175;}
    .event-card-price-now{font-size:1.35rem;font-weight:700;color:#0E2A47;line-height:1;letter-spacing:.01em;}
    .event-card-price-was{font-size:0.85rem;font-weight:600;color:#8A8175;text-decoration:line-through;line-height:1;padding-left:10px;border-left:1px solid #d8d0c4;}
    .event-card-media{position:relative;width:100%;aspect-ratio:16/10;min-height:200px;overflow:hidden;flex-shrink:0;}
    .tour-card-media{position:relative;width:100%;aspect-ratio:10/11.5;min-height:260px;overflow:hidden;flex-shrink:0;}
    .event-row-media{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:0.75rem;}
    .event-card-media a,.event-card-media img,.tour-card-media a,.tour-card-media img,.event-row-media a,.event-row-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    .atrium-inner-banner{min-height:260px;}
    @media (min-width:768px){.atrium-inner-banner{min-height:340px;}}
    .atrium-cities-section{padding-bottom:3.5rem;}
    .atrium-cities-grid{display:grid;grid-template-columns:1fr;gap:24px;align-items:stretch;}
    @media (min-width:640px){.atrium-cities-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;}}
    @media (min-width:1024px){.atrium-cities-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;}}
    .atrium-city-card{display:flex;flex-direction:column;height:100%;background:#fff;border:1px solid #EFE8DC;border-radius:16px;overflow:hidden;box-shadow:0 10px 28px rgba(14,42,71,.07);text-decoration:none;color:inherit;}
    .atrium-city-card:hover{border-color:#E07A3D;box-shadow:0 14px 32px rgba(14,42,71,.12);}
    .atrium-city-media{position:relative;aspect-ratio:4/3;min-height:210px;overflow:hidden;background:#0E2A47;}
    .atrium-city-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s ease;}
    .atrium-city-card:hover .atrium-city-media img{transform:scale(1.06);}
    .atrium-city-media:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,42,71,.45),transparent 52%);}
    .atrium-city-count{position:absolute;left:14px;bottom:14px;z-index:1;background:#E07A3D;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:999px;}
    .atrium-city-row .atrium-city-count{position:static;margin-bottom:10px;display:inline-block;}
    .atrium-city-body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1;}
    .atrium-city-body h3{margin:0 0 8px;color:#0E2A47;font-size:1.25rem;line-height:1.3;}
    .atrium-city-card:hover .atrium-city-body h3{color:#E07A3D;}
    .atrium-city-body p{margin:0 0 14px;color:#6B6358;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;}
    .atrium-city-link{margin-top:auto;color:#0E2A47;font-size:13px;font-weight:700;letter-spacing:.03em;}
    .atrium-city-card:hover .atrium-city-link{color:#E07A3D;}
    .atrium-cities-list{display:flex;flex-direction:column;gap:18px;}
    .atrium-city-row{display:flex;flex-wrap:wrap;background:#fff;border:1px solid #EFE8DC;border-radius:16px;overflow:hidden;box-shadow:0 10px 28px rgba(14,42,71,.07);text-decoration:none;color:inherit;}
    .atrium-city-row:hover{border-color:#E07A3D;}
    .atrium-city-row-media{position:relative;flex:0 0 100%;min-height:200px;aspect-ratio:16/10;overflow:hidden;background:#0E2A47;}
    @media (min-width:768px){.atrium-city-row{flex-wrap:nowrap;align-items:stretch;}.atrium-city-row-media{flex:0 0 38%;min-height:220px;aspect-ratio:auto;}}
    .atrium-city-row-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s ease;}
    .atrium-city-row:hover .atrium-city-row-media img{transform:scale(1.05);}
    .atrium-city-row-body{padding:20px 22px;display:flex;flex-direction:column;justify-content:center;flex:1;}
    .atrium-city-row-body h3{margin:0 0 8px;color:#0E2A47;font-size:1.4rem;}
    .atrium-city-row:hover .atrium-city-row-body h3{color:#E07A3D;}
    .atrium-city-row-body p{margin:0 0 14px;color:#6B6358;font-size:15px;line-height:1.55;}
    .header,.main-navigation,.main-menu,.main-menu ul,.main-menu ul li{overflow:visible!important;}
    @media (min-width: 992px) {
      .main-navigation{position:relative;z-index:70;}
      .main-menu > ul{align-items:stretch;}
      .main-menu > ul > li.has-mega{position:static;}
      .main-menu > ul > li.has-mega > a.has-mega-trigger{
        display:inline-flex;align-items:center;min-height:52px;padding:16px 8px;
      }
      .atrium-mega-menu{
        position:absolute!important;
        top:calc(100% - 4px);
        left:0;right:0;width:100%;
        z-index:80;
        padding-top:4px;padding-bottom:8px;
        pointer-events:auto;
        box-shadow:0 18px 40px rgba(14,42,71,.1);
      }
      .main-menu ul li.has-mega:hover > .atrium-mega-menu,
      .main-menu ul li.has-mega:focus-within > .atrium-mega-menu{
        display:block!important;
      }
    }
    .atrium-mega-inner{align-items:stretch;}
    .atrium-mega-promo-col{display:flex;}
    .atrium-menu-promo{flex:1 1 auto;width:100%;min-height:100%;height:auto;}
    .atrium-menu-promo-media:after{content:"";position:absolute;inset:0;background:rgba(14,42,71,.62);}
    .atrium-menu-promo-copy h4,.atrium-menu-promo-copy p{color:#fff!important;}
    .atrium-home-hero{position:relative;min-height:calc(100vh - 116px);overflow:hidden;}
    .atrium-home-hero-media{position:absolute;inset:0;z-index:0;}
    .atrium-home-hero-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    .atrium-home-hero-media:before{content:"";position:absolute;inset:0;z-index:1;background:rgba(14,42,71,.42);}
    .atrium-home-hero-media:after{content:"";position:absolute;inset-x:0;bottom:0;height:34%;z-index:1;background:linear-gradient(to top,rgba(224,122,61,.32),transparent);}
    .atrium-home-hero .hero-content-slider{position:relative;z-index:2;}
    .atrium-search-form{display:flex;flex-wrap:wrap;align-items:center;gap:8px 0;padding:6px 6px 6px 16px;border-radius:999px;width:100%;}
    .atrium-search-form--page{border:1px solid #E4DCCE;margin-bottom:2rem;}
    .atrium-search-field{flex:1 1 160px;min-width:0;padding:2px 16px;border-right:1px solid #EFE8DC;}
    .atrium-search-field:last-of-type{border-right:none;}
    .atrium-search-field label{display:block;margin:0;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#0E2A47;line-height:1.2;}
    .atrium-search-form .form-control{height:22px!important;padding:0!important;border:0!important;box-shadow:none!important;font-size:14px!important;line-height:22px!important;font-weight:400!important;background-color:#fff!important;}
    .atrium-search-submit{flex:0 0 44px;width:44px;height:44px;margin-left:8px;border:0;border-radius:50%;background:#E07A3D;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;}
    .atrium-search-submit:hover{background:#0E2A47;}
    .atrium-gallery-hide{display:none!important;}
    .atrium-gallery-grid{display:grid;grid-template-columns:1fr;gap:28px;}
    @media (min-width:768px){.atrium-gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media (min-width:1024px){.atrium-gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
    .atrium-gallery-tile{position:relative;overflow:hidden;border-radius:12px;aspect-ratio:1/1;background:#F4EFE6;}
    .atrium-gallery-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    .gallery-masonry{column-count:1;column-gap:1.75rem;}
    @media (min-width:768px){.gallery-masonry{column-count:2;}}
    @media (min-width:1024px){.gallery-masonry{column-count:3;}}
    .gallery-masonry-item{break-inside:avoid;margin-bottom:1.75rem;}
    .gallery-masonry-item img{display:block;width:100%;height:auto;border-radius:12px;}
    .atrium-portfolio-section{position:relative;z-index:1;padding-bottom:5rem;}
    .atrium-portfolio-grid{display:grid;grid-template-columns:1fr;gap:28px;align-items:start;}
    @media (min-width:768px){.atrium-portfolio-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media (min-width:1024px){.atrium-portfolio-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 28px;}}
    .atrium-portfolio-item{min-width:0;}
    .atrium-portfolio-item.is-hidden{display:none!important;}
    .atrium-portfolio-media{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:16px;background:#F4EFE6;}
    .atrium-portfolio-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s ease;}
    .atrium-portfolio-media:after{content:"";position:absolute;inset:0;background:rgba(14,42,71,.18);}
    .atrium-portfolio-item:hover .atrium-portfolio-media img{transform:scale(1.05);}
    .atrium-portfolio-copy{padding:14px 2px 0;}
    .atrium-portfolio-copy h3{margin:0 0 4px;color:#0E2A47;font-size:1.25rem;line-height:1.3;}
    .atrium-portfolio-copy span{color:#6B6358;font-size:14px;}
    .footer-part{position:relative;overflow:hidden;}
    .footer-part > .container{position:relative;z-index:2;}
    .footer-bg{overflow:hidden;pointer-events:none;z-index:0;}
    .footer-bg img{display:block;width:100%;height:auto;}
    .footer-bg:before{background:linear-gradient(180deg,#fff 0%,#fff 20%,rgba(255,255,255,.75) 45%,rgba(255,255,255,0) 80%);}
    @media (max-width:767px){
      .atrium-search-form{border-radius:16px;padding:12px;flex-direction:column;align-items:stretch;}
      .atrium-search-field{border-right:0;border-bottom:1px solid #EFE8DC;padding:8px 4px;}
      .atrium-search-field:last-of-type{border-bottom:0;}
      .atrium-search-submit{width:100%;height:44px;margin:8px 0 0;border-radius:12px;}
    }
  </style>
  <noscript><style>body > * { visibility: visible !important; } .preloader { display: none !important; }</style></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/all-fontawesome.min.css">
  <link rel="stylesheet" href="/assets/css/swiper-bundle.min.css">
  <link rel="stylesheet" href="/assets/css/aos.css">
  <link rel="stylesheet" href="/assets/css/magnific-popup.css">
  <link rel="stylesheet" href="/assets/css/video-modal.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link id="atrium-main-css" rel="stylesheet" href="/assets/css/dist/output.css?v={{ now format='YmdHis' }}">
  <script>
    (function () {
      var link = document.getElementById('atrium-main-css');
      function show() {
        function apply() {
          if (document.body) document.body.classList.add('is-ready');
          else document.addEventListener('DOMContentLoaded', apply);
        }
        apply();
      }
      if (link) {
        if (link.sheet) show();
        else link.addEventListener('load', show);
      }
      setTimeout(show, 2000);
    })();
  </script>
</head>
