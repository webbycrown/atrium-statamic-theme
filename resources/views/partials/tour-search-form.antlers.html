<form action="/events" method="get" class="booking-form atrium-search-form bg-white{{ unless hero }} atrium-search-form--page{{ /unless }}">
  <div class="atrium-search-field">
    <label for="event-q">Keyword</label>
    <input id="event-q" type="text" name="q" value="{{ get:q }}" placeholder="Type your keyword here..." class="form-control">
  </div>
  <div class="atrium-search-field">
    <label for="event-city">City</label>
    <select id="event-city" name="destination" class="form-control">
      <option value="">Which city?</option>
      {{ collection:destinations }}
      <option value="{{ slug }}"{{ if get:destination == slug }} selected{{ /if }}>{{ title }}</option>
      {{ /collection:destinations }}
    </select>
  </div>
  <div class="atrium-search-field">
    <label for="event-type">Event type</label>
    <select id="event-type" name="duration" class="form-control">
      <option value="">Event type</option>
      {{ taxonomy:tour_type }}
      <option value="{{ slug }}"{{ if get:duration == slug }} selected{{ /if }}>{{ title }}</option>
      {{ /taxonomy:tour_type }}
    </select>
  </div>
  <button type="submit" class="atrium-search-submit" aria-label="Search events">
    <i class="fa-regular fa-magnifying-glass"></i>
  </button>
</form>
