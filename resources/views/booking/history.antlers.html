<div class="bg-gray-200 mb-10 md:mb-14 py-10 md:py-0">
  <div class="container">
    <div class="md:flex">
      {{ partial:booking/account-nav current="history" }}
      <div class="pt-8 mb-0 md:py-8 md:pb-14 md:px-5 xl:px-8 w-full md:w-[calc(100%-258px)]">
        <div class="mb-7">
          <h2 class="text-xl md:text-25 mb-2">Booking History</h2>
          {{ if logged_in }}
          <p>Orders saved to the email on your account.</p>
          {{ else }}
          <p><a href="/login" class="text-primary-900 underline">Sign in</a> to see every booking for your email. Guest checkouts stay in this browser.</p>
          {{ /if }}
        </div>
        <div class="shadow-box-3 w-full rounded-xl py-6 px-5 md:px-8 bg-white">
          {{ partial:booking/order-table }}
        </div>
      </div>
    </div>
  </div>
</div>
