{{ partial:inner-banner :banner_title="title" :banner_image="image:url" }}
<section>
  <div class="container">
    <div class="blog-detail max-w-4xl mx-auto">
      <span class="text-12 text-dark-800">{{ date format="M j, Y" }}</span>
      <h2 class="mb-6">{{ title }}</h2>
      {{ image }}
      <div class="mb-8 rounded-2xl overflow-hidden">
        <img src="{{ url }}" alt="{{ title }}" class="w-full">
      </div>
      {{ /image }}
      <div class="leading-1xl">{{ content }}</div>
    </div>
  </div>
</section>
<section class="related-post-section">
  <div class="container">
    <h3 class="mb-8">Related posts</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-7">
      {{ collection:blogs limit="3" sort="date:desc" }}
      <div class="relative group">
        <a href="{{ url }}">
          {{ if image }}<img src="{{ image:url }}" alt="{{ title }}" class="rounded-xl w-full h-48 object-cover mb-3">{{ /if }}
          <h4 class="text-lg">{{ title }}</h4>
        </a>
      </div>
      {{ /collection:blogs }}
    </div>
  </div>
</section>
