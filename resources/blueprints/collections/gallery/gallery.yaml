title: Gallery
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field: { type: text, required: true }
          -
            handle: image
            field: { type: assets, container: assets, max_files: 1, display: Image }
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field: { type: slug }
