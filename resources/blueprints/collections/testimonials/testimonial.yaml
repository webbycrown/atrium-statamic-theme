title: Testimonial
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field: { type: text, required: true }
          -
            handle: quote
            field: { type: textarea, display: Quote }
          -
            handle: location
            field: { type: text, display: Location }
          -
            handle: photo
            field: { type: assets, container: assets, max_files: 1, display: Photo }
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field: { type: slug }
