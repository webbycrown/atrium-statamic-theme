title: FAQ
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field: { type: text, required: true }
          -
            handle: answer
            field: { type: textarea, display: Answer }
          -
            handle: faq_category
            field:
              type: terms
              taxonomies:
                - faq_category
              max_items: 1
              display: Category
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field: { type: slug }
